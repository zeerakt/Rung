# ==============================================================================
# Nginx Reverse Proxy + WebSocket Upgrade Config for Royal Rung on Oracle VM
# Place at: /etc/nginx/sites-available/rung
# Run `sudo certbot --nginx -d rung-api.yourdomain.com` to enable HTTPS / WSS
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Health check & WebSocket endpoint
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Client Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket connections alive during long Rung hands
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
